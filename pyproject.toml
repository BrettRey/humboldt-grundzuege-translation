[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "humboldt-edition"
version = "0.2.2"
description = "Portable, source-linked Humboldt translation and annotation infrastructure"
requires-python = ">=3.11"
dependencies = []
license = {text = "MIT"}

[project.scripts]
humboldt = "humboldt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
humboldt = ["migrations/*.sql", "record_schemas/*.json"]
